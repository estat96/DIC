name: Build APK
on: { push: { branches: [ main ] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk DIC.apk
      - uses: actions/upload-artifact@v4
        with: { name: DIC-apk, path: DIC.apk }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "build-${{ github.run_number }}", files: DIC.apk }
    permissions: { contents: write }
