name: Build APK
on: { push: { branches: [ main ] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E -A4 "^e: |error:|What went wrong|FAILED|Error at|AssertionError" build.log | grep -v "^--" | head -9 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - run: cp app/build/outputs/apk/release/app-release.apk DIC.apk
      - uses: actions/upload-artifact@v4
        with: { name: DIC-apk, path: DIC.apk }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "build-${{ github.run_number }}", files: DIC.apk }
    permissions: { contents: write }
  smoke:
    needs: build
    permissions: { contents: write }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: DIC-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb root || true; sleep 3
            adb install -r -g DIC.apk
            adb logcat -c
            adb shell am start -W -n com.dic.app/.MainActivity
            sleep 15
            adb exec-out screencap -p > main.png
            adb shell input tap 300 500 || true
            sleep 3
            adb shell am start -W -n com.dic.app/.PlayerActivity || true
            sleep 6
            adb exec-out screencap -p > player.png
            adb shell input keyevent 4; sleep 2; adb shell input keyevent 4; sleep 2
            adb shell pidof com.dic.app > pid.txt || true
            adb logcat -d > logcat.txt || true
            grep -E "FATAL EXCEPTION|E AndroidRuntime|at com\.dic" logcat.txt | grep -v "TransactionExecutor\|ActivityThread\|Shutting" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            if [ ! -s pid.txt ]; then echo "::error::APP NOT RUNNING"; else echo "::notice::app alive pid $(cat pid.txt)"; fi
      - name: Attach screenshots to release
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "build-${{ github.run_number }}" main.png player.png logcat.txt --clobber -R ${{ github.repository }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: "logcat.txt\nscreen.png" }
